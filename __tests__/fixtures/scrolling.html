<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>scrolling fixture</title>
    <link rel="stylesheet" href="/fixture.css" />
    <style>
      /* Short box plus a tall page: exercises both highlights scrolling with
         the field's own content and staying put when the window scrolls. */
      #editor {
        height: 120px;
      }
      .spacer {
        height: 1500px;
      }
    </style>
  </head>
  <body>
    <textarea id="editor" class="editor" spellcheck="false"></textarea>
    <div class="spacer"></div>
  </body>
</html>
