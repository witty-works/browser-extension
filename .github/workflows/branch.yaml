name: Build dev extension from branch

on:
  push:
    branches-ignore:
      - main

# Reading the repository is all these builds need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci

      - name: Copy example config if missing
        run: |
          if [ -f source/witty.config.json.example ] && [ ! -f source/witty.config.json ]; then
            cp source/witty.config.json.example source/witty.config.json
          fi

      - name: Build artifacts
        run: |
          npm run build:chrome

      - name: Remove key in manifest
        run: |
          sed -i '/"key":/d' extension/chrome/manifest.json

      - name: Store Chrome Development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-dev
          path: |
            extension/chrome
