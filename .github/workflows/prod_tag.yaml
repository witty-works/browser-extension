name: Build prod extension and source code from tag

# Store releases: tags like 2.1.0 (see build/releaseVersion.js).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

# Reading the repository is all these builds need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: "https://2cb75085e6dba41ead4774395caa4641@o4507044685938688.ingest.de.sentry.io/4507044706713680"
      SENTRY_SAMPLE_RATE: 0.001
      SENTRY_TRACE_RATE: 0.001
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERSION_STRING: ${{github.ref_name}}-prod

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history, to check where the tag's commit is.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      # Only a commit on dev or main is released: a matching tag pushed on any
      # other branch builds nothing.
      - name: Check the tag is on dev or main
        run: |
          git fetch --no-tags origin dev main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check the tag matches the version in the repo
        run: node build/releaseVersion.js --check "${GITHUB_REF_NAME}"

      # Only the Prod endpoint, and the prod Sentry settings from env.
      - name: Write the release config
        run: node build/prepareReleaseConfig.js --prod

      # Without the repository history, which stays for the build: the Sentry
      # plugin reads it to attach the release's commits.
      - name: Zip source code
        run: zip -r release.zip . -x '.git/*'

      - name: Upload source code
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-code
          path: release.zip

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Prod Firefox artifacts
        run: |
          npm run build:firefox-with-sourcemaps

      - name: Remove *.map files
        run: rm -rf extension/firefox/js/*.map

      - name: Store Firefox Prod artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox
          path: |
            extension/firefox

      - name: Remove Firefox background worker hack
        run: |
          sed -i '/"scripts": \["js\/background.bundle\.js"\],/d' source/manifest.json

      - name: Build Prod Chrome artifacts
        run: |
          npm run build:chrome-with-sourcemaps

      - name: Remove *.map files
        run: rm -rf extension/chrome/js/*.map

      - name: Remove key in manifest
        run: |
          sed -i '/"key":/d' extension/chrome/manifest.json

      - name: Store Chrome Prod artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome
          path: |
            extension/chrome

  # The release's page on GitHub, with notes generated from the pull requests
  # since the previous release.
  release-page:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$VERSION" --generate-notes

  # main follows the releases: a pull request from the release into main, for
  # a maintainer to approve and merge (main requires a reviewed pull request).
  release-to-main:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Open a pull request from the release into main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          git push origin "HEAD:refs/heads/release/${VERSION}"
          gh pr create --base main --head "release/${VERSION}" \
            --title "Release ${VERSION}" \
            --body "Brings main to release ${VERSION}. Merge with a merge commit; the release branch can be deleted afterwards."
