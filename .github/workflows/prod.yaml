name: Build prod extension and source code

on:
  push:
    branches:
      - feature/update-ga-action-versions
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'

      - name: Disable development mode
        run: |
          sed 's/export const DEV_ENV = true;/export const DEV_ENV = false;/' source/shared/constants.ts > constants.ts
          mv constants.ts source/shared/constants.ts

      - name: Remove git
        run: rm -rf .git

      - name: Zip source code
        run: zip release.zip ./ -r

      - name: Upload source code
        uses: actions/upload-artifact@v3
        with:
          name: source-code
          path: release.zip

      - name: Install yarn
        run: |
          npm install --global yarn

      - id: cache-yarn
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache-yarn.outputs.cache-hit != 'true'
        run: |
          yarn install

      - name: Build artifacts
        run: |
          yarn run build

      - name: Store Chrome artifacts
        uses: actions/upload-artifact@v3
        with:
          name: chrome
          path: |
            extension/chrome

      - name: Store Firefox artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firefox
          path: |
            extension/firefox.xpi
