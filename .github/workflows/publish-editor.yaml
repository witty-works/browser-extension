name: Publish editor

# Publishes @witty-works/editor to npm when a tag like `editor-v0.1.0` is
# pushed. The tag has to match packages/editor/package.json's version.
#
# Needs the repository secret NPM_TOKEN: an npm automation token with publish
# rights on the @witty-works scope.

on:
  push:
    tags:
      - "editor-v*"

permissions:
  contents: read
  # npm provenance: links the published package to this workflow run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/editor/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "editor-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      # The example config carries no credentials, so none can be bundled; the
      # editor build also strips them and fails if any turn up.
      - name: Use the example config
        run: cp source/witty.config.json.example source/witty.config.json

      # prepublishOnly runs the type check, the unit tests and the build.
      - name: Publish
        run: npm publish -w @witty-works/editor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
