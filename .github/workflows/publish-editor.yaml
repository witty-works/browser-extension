name: Publish editor

# Publishes @witty-works/editor to npm from the same version tags that build
# the extension (see build/releaseVersion.js):
#
#   2.1.0          npm dist-tag latest
#   2.1.0-beta.3   npm dist-tag beta
#
# No npm token: npm trusts this workflow (trusted publishing, configured in the
# package's settings on npmjs.com) through the run's OIDC identity. It may only
# stage a version; a maintainer approves it on npmjs.com with 2FA, or with
# `npm stage approve <stage-id>`, before it is published.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: read
  # Trusted publishing and provenance both authenticate with the run's OIDC
  # token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history, to check where the tag's commit is.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      # Staged publishing needs npm 12; pinned, as the release is published
      # with it.
      - run: npm install -g npm@12.1.0

      # Only a commit on dev or main is released: a matching tag pushed on any
      # other branch builds nothing.
      - name: Check the tag is on dev or main
        run: |
          git fetch --no-tags origin dev main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check the tag matches the version in the repo
        run: node build/releaseVersion.js --check "${GITHUB_REF_NAME}"

      # The example config carries no credentials, so none can be bundled; the
      # editor build also strips them and fails if any turn up.
      - name: Use the example config
        run: cp source/witty.config.json.example source/witty.config.json

      # Run explicitly rather than relying on prepublishOnly during staging.
      - name: Type check, test and build
        run: |
          npm run typecheck -w @witty-works/editor
          npm test -w @witty-works/editor
          npm run build -w @witty-works/editor

      # From the package directory: `npm stage` is not workspace-aware.
      - name: Stage for approval
        working-directory: packages/editor
        run: |
          dist_tag=$(node -p "require('../../build/releaseVersion.js').parseVersion(process.argv[1]).distTag" "${GITHUB_REF_NAME}")
          npm stage publish --tag "${dist_tag}" --provenance
