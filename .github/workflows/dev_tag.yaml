name: Build dev extension from tag

# Beta builds for the dev listing: tags like 2.1.0-beta.3 (see
# build/releaseVersion.js). The manifest carries them as 2.1.0.3.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

# Reading the repository is all these builds need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: "https://2cb75085e6dba41ead4774395caa4641@o4507044685938688.ingest.de.sentry.io/4507044706713680"
      SENTRY_SAMPLE_RATE: 1.0
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERSION_STRING: ${{github.ref_name}}-dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history, to check where the tag's commit is.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      # Only a commit on dev or main is released: a matching tag pushed on any
      # other branch builds nothing.
      - name: Check the tag is on dev or main
        run: |
          git fetch --no-tags origin dev main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check the tag matches the version in the repo
        run: node build/releaseVersion.js --check "${GITHUB_REF_NAME}"

      # Production builds default to the Prod endpoint on their own.
      - name: Write the release config with dev Sentry settings
        run: node build/prepareReleaseConfig.js

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Dev artifacts
        run: |
          npm run build:chrome-with-sourcemaps

      - name: Remove key in manifest
        run: |
          sed -i '/"key":/d' extension/chrome/manifest.json

      - name: Remove *.map files
        run: rm -rf extension/chrome/js/*.map

      - name: Store Chrome Dev artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-dev
          path: |
            extension/chrome
