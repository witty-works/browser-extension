name: Build dev extension from tag

# Beta builds for the dev listing: tags like 2.1.0-beta.3 (see
# build/releaseVersion.js). The manifest carries them as 2.1.0.3.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

# Reading the repository is all these builds need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # SENTRY_AUTH_TOKEN is set only on the build steps that upload source
    # maps, so the install scripts run by `npm ci` cannot read it.
    env:
      SENTRY_DSN: "https://2cb75085e6dba41ead4774395caa4641@o4507044685938688.ingest.de.sentry.io/4507044706713680"
      SENTRY_SAMPLE_RATE: 1.0
      SENTRY_VERSION_STRING: ${{github.ref_name}}-dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history, to check where the tag's commit is.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      # Only a commit on dev or main is released: a matching tag pushed on any
      # other branch builds nothing.
      - name: Check the tag is on dev or main
        run: |
          git fetch --no-tags origin dev main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check the tag matches the version in the repo
        run: node build/releaseVersion.js --check "${GITHUB_REF_NAME}"

      # Production builds default to the Prod endpoint on their own.
      - name: Write the release config with dev Sentry settings
        run: node build/prepareReleaseConfig.js

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Dev artifacts
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm run build:chrome-with-sourcemaps

      - name: Remove key in manifest
        run: |
          sed -i '/"key":/d' extension/chrome/manifest.json

      - name: Remove *.map files
        run: rm -rf extension/chrome/js/*.map

      - name: Store Chrome Dev artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-dev
          path: |
            extension/chrome

  # The release's page on GitHub, with notes generated from the pull requests
  # since the previous release.
  release-page:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        # A re-run keeps the page that is there.
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release page for ${VERSION} exists already."
            exit 0
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$VERSION" --generate-notes --prerelease
