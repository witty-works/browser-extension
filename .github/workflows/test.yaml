name: Run Tests

on:
  push:
  schedule:
    # every 4 hours
    - cron: "0 */4 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud attributes issues to authors and works out what is new on
          # a branch from the history, so a shallow clone degrades its analysis.
          fetch-depth: 0

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Copy example config if missing
        run: |
          if [ -f source/witty.config.json.example ] && [ ! -f source/witty.config.json ]; then
            cp source/witty.config.json.example source/witty.config.json
          fi

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # `npm test` builds the extension with TESTING=true itself, so there is no
      # separate build step and nothing to patch into the source first. The
      # suite is self-contained — it serves its own fixture pages and mocks the
      # NLP API — so it needs no dashboard, no NLP API and no credentials.
      - name: Run tests
        run: xvfb-run npm test

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
