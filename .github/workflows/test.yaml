name: Run Tests

on: [push]
env:
  PREMIUM_TEST_USER_EMAIL: ${{ secrets.PREMIUM_TEST_USER_EMAIL }}
  PREMIUM_TEST_USER_PASSWORD: ${{ secrets.PREMIUM_TEST_USER_PASSWORD }}
  EXTENSION_ID_DEV: ${{ secrets.EXTENSION_ID_DEV }}

jobs:
  build:
    runs-on: ubuntu-20.04
    # container: mcr.microsoft.com/playwright:v1.24.2-focal //try this again when v1.25.0 comes out

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'

      # - name: Install yarn
      #   run: |
      #     npm install --global yarn

      # - id: cache-yarn
      #   uses: actions/cache@v1
      #   with:
      #     path: ./node_modules
      #     key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        # if: steps.cache-yarn.outputs.cache-hit != 'true'
        run: yarn install

      - name: Build artifacts
        run: yarn build:chrome

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run tests
        env:
          PREMIUM_TEST_USER_EMAIL: ${{ secrets.PREMIUM_TEST_USER_EMAIL }}
          PREMIUM_TEST_USER_PASSWORD: ${{ secrets.PREMIUM_TEST_USER_PASSWORD }}
          EXTENSION_ID_DEV: ${{ secrets.EXTENSION_ID_DEV }}
        run: xvfb-run yarn test

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v2
        with:
          name: test-results
          path: test-results

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
