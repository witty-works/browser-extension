name: Build extension

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
          cache: 'npm'

      - name: Install yarn
        run: |
          npm install --global yarn

      - id: cache-yarn
        uses: actions/cache@v1
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.lock') }}

      - name: Install dependencies
        if: steps.cache-yarn.outputs.cache-hit != 'true'
        run: |
          yarn install

      - name: Build artifacts
        run: |
          yarn run build

      - name: Store Chrome artifacts
        uses: actions/upload-artifact@v2
        with:
          name: chrome
          path: |
            extension/chrome

      - name: Store Firefox artifacts
        uses: actions/upload-artifact@v2
        with:
          name: firefox
          path: |
            extension/firefox.xpi

      - name: Store Opera artifacts
        uses: actions/upload-artifact@v2
        with:
          name: opera
          path: |
            extension/opera.crx