sonar.organization=witty-works
sonar.projectKey=witty-works_browser-extension

# relative paths to source directories. More details and properties are described
# in https://sonarcloud.io/documentation/project-administration/narrowing-the-focus/
sonar.sources=source,packages/editor/src
sonar.exclusions=packages/editor/src/**/*.test.ts
sonar.language=js
sonar.tests=__tests__,packages/editor/src
sonar.test.inclusions=__tests__/**/*,packages/editor/src/**/*.test.ts
sonar.cpd.exclusions=source/_locales/**/*,source/i18n/*

# Coverage comes from the editor's unit tests (`npm run test:unit`, run by the
# CI workflow before the scan). The extension's suites drive the built
# extension through a real browser rather than instrumenting modules, so the
# extension has no coverage report. Without the exclusion its files would count
# as uncovered and fail the coverage condition on every change to them.
sonar.javascript.lcov.reportPaths=packages/editor/coverage/lcov.info
sonar.coverage.exclusions=source/**,packages/editor/src/demo.ts

sonar.sourceEncoding=UTF-8