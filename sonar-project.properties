sonar.organization=witty-works
sonar.projectKey=witty-works_browser-extension

# relative paths to source directories. More details and properties are described
# in https://sonarcloud.io/documentation/project-administration/narrowing-the-focus/
sonar.sources=source
sonar.exclusions=
sonar.language=js
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*
sonar.cpd.exclusions=source/_locales/**/*,source/i18n/*
# No coverage report is produced: the suite drives the built extension through
# a real browser rather than instrumenting modules, so there is no lcov to point
# at. Left commented rather than removed so it is clear this is deliberate.
# sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.sourceEncoding=UTF-8